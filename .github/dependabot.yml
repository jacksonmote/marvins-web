# Opens pull requests when a pinned GitHub Action has a newer release.
# The CI-only tools in .github/tools/ (html-validate and Lighthouse CI) are
# updated by hand for now; see the npm entry below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Only propose releases that have been out for at least 7 days.
    # Security updates are not delayed.
    cooldown:
      default-days: 7

  # CI-only tools; the website itself has no dependencies.
  # Version update pull requests are turned off (open-pull-requests-limit: 0):
  # GitHub currently rejects the pull requests Dependabot tries to open for
  # these files (HTTP 400 "invalid or unauthorized changes"; see
  # github.com/dependabot/dependabot-core/issues/15721). Update the tools by
  # hand instead (README, "CI tools and updates"). Dependabot alerts still
  # cover the lockfile. Set the limit back to 5 once Dependabot can open
  # these pull requests again; the settings below are kept ready for that.
  - package-ecosystem: npm
    directory: "/.github/tools"
    schedule:
      interval: weekly
    # Only propose versions that have been out for at least 14 days.
    # Security updates are not delayed.
    cooldown:
      default-days: 14
    # One pull request for all of the tools' version updates, and one for all
    # of their security updates
    groups:
      ci-tools:
        applies-to: version-updates
        patterns: ["*"]
      ci-tools-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 0
