# Checks the site for HTML errors, broken links, and missing or invalid site files.
# Runs on every pull request into main, every push to main, every Monday morning,
# and on demand
# (Actions tab > Site checks > Run workflow). A failed run emails the repo owner.
#
# html-validate is installed from the CI-only lockfile in .github/tools/ with
# package scripts blocked; nothing is downloaded with npx. The lychee version is
# pinned in the Link check job.
name: Site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1" # Mondays at 13:00 UTC (9 AM EDT, 8 AM EST)
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a PR cancels that PR's older run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Never run package install scripts (also set in .github/tools/.npmrc)
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/tools/package-lock.json
      # Installs the exact versions in .github/tools/package-lock.json, with
      # package scripts blocked.
      - run: npm ci --ignore-scripts --prefix .github/tools
      # Rules are configured in .htmlvalidate.json
      - run: .github/tools/node_modules/.bin/html-validate index.html 404.html privacy/index.html accessibility/index.html

  links:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Settings are in lychee.toml. The action downloads the lychee program
      # itself, so its version is set here rather than left to the action's
      # default; when Dependabot updates the action, raise it by hand (README
      # "CI tools and updates"). lychee gets no GitHub token (token: ""): it
      # only uses one to avoid GitHub's rate limits, and the site's few
      # github.com links stay well under them.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ""
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}
            --no-progress
            index.html 404.html privacy/index.html accessibility/index.html

  files:
    name: Site files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Offline file list, manifest, structured data, local file references,
      # privacy and accessibility footer links, outside requests, and the
      # Content-Security-Policy
      - run: node .github/scripts/check-site.js
