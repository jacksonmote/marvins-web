# Checks the site for HTML errors and broken links.
# Runs on every push to main, every Monday morning, and on demand
# (Actions tab > Site checks > Run workflow). A failed run emails the repo owner.
name: Site checks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1" # Mondays at 13:00 UTC (9 AM Eastern)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Rules are configured in .htmlvalidate.json
      - run: npx --yes html-validate@11 index.html 404.html

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Settings are in lychee.toml
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}
            --no-progress
            index.html 404.html

  files:
    name: Site files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Offline file list, manifest, structured data, and local file references
      - run: node .github/scripts/check-site.js
